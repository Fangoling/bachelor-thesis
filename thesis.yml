murilloEmpoweringInterfacesSystem2014:
  type: article
  title:
    value: 'Empowering {Interfaces} for {System Administrators}: {Keeping} the {Command Line} in {Mind} When {Designing GUIs}'
    short: Empowering {Interfaces} for {System Administrators}
  author:
