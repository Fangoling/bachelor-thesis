dengRACONTEURKnowledgeableInsightful2025:
  type: article
  title:
    value: '{RACONTEUR}: {A Knowledgeable}, {Insightful}, and {Portable LLM-Powered Shell Command Explainer}'
    short: '{RACONTEUR}'
  author:
  - Deng, Jiangyi
