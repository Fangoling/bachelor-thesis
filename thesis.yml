murilloEmpoweringInterfacesSystem2014:
  type: article
  title:
    value: 'Empowering {Interfaces} for {System Administrators}: {Keeping} the {Command Line} in {Mind} When {Designing GUIs}'
    short: Empowering {Interfaces} for {System Administrators}
  author:
  - Murillo, Sandra R.
  - Sánchez, J. Alfredo
  date: 2014-09-10
  page-range: 1-4
  url:
    value: https://dl.acm.org/doi/10.1145/2662253.2662300
    date: 2025-08-19
  serial-number:
    doi: 10.1145/2662253.2662300
    isbn: 978-1-4503-2880-7
  abstract: In terms of usability, network management software based on command line interfaces (CLI) is efficient but error prone. With GUIs, a new generation of security tools emerged and were adopted by young system administrators. Though usability has improved, it has been argued that CLI-based software tends to support better user performance. Incorporating CLI advantages into graphical versions (or vice versa) remains a challenge. This paper presents a quantitative study regarding system administrators’ practices and preferences regarding GUIs and CLIs and reports on initial results of a usability evaluation performed on proposed interfaces that are informed by our study. Personalization features are particularly appreciated by network administrators, which suggests possible strategies for graphical interface designs that improve user experience while maintaining the positive aspects of CLI-based software.
