    date: 2025-10-14
  serial-number:
    doi: 10.14722/ndss.2025.230798
    isbn: 979-8-9894372-8-3
  abstract: Malicious shell commands are linchpins to many cyber-attacks, but may not be easy to understand by security analysts due to complicated and often disguised code structures. Advances in large language models (LLMs) have unlocked the possibility of generating understandable explanations for shell commands. However, existing general-purpose LLMs suffer from a lack of expert knowledge and a tendency to hallucinate in the task of shell command explanation. In this paper, we present RACONTEUR, a knowledgeable, expressive and portable shell command explainer powered by LLM. RACONTEUR is infused with professional knowledge to provide comprehensive explanations on shell commands, including not only what the command does (i.e., behavior) but also why the command does it (i.e., purpose). To shed light on the high-level intent of the command, we also translate the natural-language-based explanation into standard technique & tactic defined by MITRE ATT&CK, the worldwide knowledge base of cybersecurity. To enable RACONTEUR to explain unseen private commands, we further develop a documentation retriever to obtain relevant information from complementary documentations to assist the explanation process. We have created a largescale dataset for training and conducted extensive experiments to evaluate the capability of RACONTEUR in shell command explanation. The experiments verify that RACONTEUR is able to provide high-quality explanations and in-depth insight of the intent of the command.
